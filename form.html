<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Validation</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <div class="success-message" id="successMessage">
            Form submitted successfully!
        </div>
    <h2>Contact Form</h2>
    
    <form id="contactForm" novalidate>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name">
            <div class="error-message" id="nameError">Please enter your full name (at least 2 characters)</div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email">
            <div class="error-message" id="emailError">Please enter a valid email address</div>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">
            <div class="error-message" id="phoneError">Please enter a valid phone number (10 digits)</div>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"></textarea>
            <div class="error-message" id="messageError">Please enter a message (at least 10 characters)</div>
        </div>

        <button type="submit">Submit Form</button>
    </form>
</div>
</body>
<script src="form.js"></script>
</html>
